# Publishes site/ to GitHub Pages on every push to main (C1).
# One-time setup in the GitHub repository: Settings > Pages > Build and deployment > Source: GitHub Actions.
# The site is static: no build step and no secrets. The FIRMS key is only used by the local pipeline.
name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate published data (fails on demo data or unverified districts)
        run: |
          pip install -r pipeline/requirements.txt
          python pipeline/validate.py --production
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Front-end tests
        run: node --test tests/*.test.mjs

  deploy:
    needs: check
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
